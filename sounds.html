<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>효과음 들어 보고 고르기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  body { margin: 0; padding: 28px 20px 60px; font-family: 'Pretendard Variable', 'Pretendard', sans-serif; font-weight: 500;
         word-break: keep-all; background: #fff8fb; color: #33244f; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  p { color: #5f5170; margin: 0 0 22px; line-height: 1.6; }
  section { margin-bottom: 26px; }
  h2 { font-size: 18px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid #eadde6; }
  .row b { min-width: 230px; font-weight: 600; }
  .now { font-size: 13px; background: #33244f; color: #ffd95a; border-radius: 999px; padding: 2px 10px; margin-left: 6px; }
  audio { height: 36px; }
</style>
</head>
<body>
<main>
  <h1>효과음 들어 보고 고르기</h1>
  <p>모두 저작권 걱정 없는 CC0 소리입니다(출처는 sounds/CREDITS.txt). «지금 씀»이 표시된 것이 룰렛에 들어간 소리예요.
     다른 게 더 좋으면 파일 이름을 알려 주세요. 배경 음악은 앞 30초만 담았습니다.</p>
  <div id="list"></div>
</main>
<script>
  const GROUPS = [
    ['뽑는 동안 배경 음악', 'bgm', ['let-the-games-begin', 'winning-the-race', 'urgent', 'spy-running'], 'let-the-games-begin'],
    ['당첨 팡파르', 'fanfare', ['classic-lick', 'hyper-ultra', 'win-sound', '8bit-lick'], 'classic-lick'],
    ['놓쳤을 때', 'miss', ['NES11', 'NES07', 'NES04', 'SAX14', 'SAX11'], 'NES11'],
    ['집게 힘이 셀 때(셈, 최강)', 'lock', ['HIT03', 'HIT11', 'HIT10', 'NES12'], 'HIT03'],
    ['집게 모터', 'motor', ['spaceEngineSmall_000', 'engineCircular_000', 'spaceEngineLow_000', 'spaceEngine_000'], 'spaceEngineSmall_000'],
  ];
  const list = document.getElementById('list');
  for (const [title, key, names, now] of GROUPS) {
    const sec = document.createElement('section');
    const h = document.createElement('h2'); h.textContent = title; sec.append(h);
    for (const n of names) {
      const row = document.createElement('div'); row.className = 'row';
      const b = document.createElement('b'); b.textContent = `${key}-${n}`;
      if (n === now) { const t = document.createElement('span'); t.className = 'now'; t.textContent = '지금 씀'; b.append(t); }
      const a = document.createElement('audio'); a.controls = true; a.preload = 'none'; a.src = `sounds/candidates/${key}-${n}.mp3`;
      row.append(b, a); sec.append(row);
    }
    list.append(sec);
  }
  // 하나를 틀면 나머지는 멈춘다
  document.addEventListener('play', e => document.querySelectorAll('audio').forEach(a => { if (a !== e.target) a.pause(); }), true);
</script>
</body>
</html>
